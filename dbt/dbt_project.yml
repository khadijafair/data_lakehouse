name: lakehouse
version: "1.0.0"
config-version: 2
profile: lakehouse

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  # Période commune aux deux sources (jours complets) : le clickstream couvre
  # 2025-09-02 16:05 -> 2025-12-02 16:04 UTC, les commandes vont jusqu'au 2025-12-01.
  funnel_start_date: "2025-09-03"
  funnel_end_date: "2025-12-01"

models:
  lakehouse:
    staging:
      # Le catalogue Iceberg JDBC ne gère pas les vues dans Trino :
      # le staging est « éphémère » (injecté en CTE dans les modèles Gold).
      +materialized: ephemeral
    gold:
      +materialized: table
      # CREATE OR REPLACE TABLE : la table Iceberg est conservée et chaque
      # exécution ajoute un snapshot -> le time travel continue de fonctionner.
      +on_table_exists: replace
