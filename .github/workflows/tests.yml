name: Tests unitaires

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.2.2 pytest-cov==5.0.0 ruff==0.6.9

      - name: Linting (ruff)
        run: ruff check spark/ tests/

      - name: Lancer les tests unitaires avec couverture
        run: pytest tests/ -v --cov=spark/common --cov-report=term-missing

  docker-build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier que l'image Airflow se construit
        run: docker build -t lakehouse-airflow-check ./docker/airflow