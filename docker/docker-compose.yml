version: "3.8"

services:

  minio:
    image: quay.io/minio/minio:latest
    container_name: lakehouse-minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5


  minio-init:
    image: quay.io/minio/mc:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/bronze &&
      mc mb --ignore-existing local/silver &&
      mc mb --ignore-existing local/gold &&
      echo 'Buckets bronze / silver / gold créés.'
      "



  postgres:
    image: postgres:15
    container_name: lakehouse-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  # Crée la base `iceberg` (catalogue Iceberg JDBC lu par Spark ET Trino).
  # Service ponctuel et idempotent : marche aussi sur un volume postgres déjà existant.
  iceberg-catalog-init:
    image: postgres:15
    container_name: lakehouse-iceberg-catalog-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: airflow
    volumes:
      - ./postgres/init-iceberg-catalog.sql:/init-iceberg-catalog.sql:ro
    entrypoint: ["psql", "-h", "postgres", "-U", "airflow", "-d", "airflow", "-f", "/init-iceberg-catalog.sql"]

  # Moteur SQL : lit et écrit les tables Iceberg des 3 catalogues (utilisé par dbt).
  # UI : http://localhost:8085 — CLI : docker exec -it lakehouse-trino trino
  trino:
    image: trinodb/trino:445
    container_name: lakehouse-trino
    depends_on:
      iceberg-catalog-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ../trino/catalog:/etc/trino/catalog:ro

  # ---------- Streaming (optionnel) : docker compose --profile streaming up -d ----------
  # Broker Kafka unique en mode KRaft (sans ZooKeeper). Limité à 512 Mo de mémoire Java.
  kafka:
    image: apache/kafka:3.9.1
    container_name: lakehouse-kafka
    profiles: ["streaming"]
    ports:
      - "29092:29092"   # accès depuis la machine hôte : localhost:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Rejoue clickstream_500k_events.csv dans le topic `clickstream` (simulation de temps réel).
  # Relancer : docker compose --profile streaming run --rm clickstream-producer --rate 500 --limit 10000
  clickstream-producer:
    build:
      context: ../streaming/producer
    container_name: lakehouse-clickstream-producer
    profiles: ["streaming"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      CLICKSTREAM_FILE: /data/clickstream_500k_events.csv
    volumes:
      - ../data/sample:/data:ro
    command: ["--rate", "2000"]
    restart: "no"

  airflow-init:
    build:
      context: ./airflow
    container_name: lakehouse-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: "lakehouse_dev_secret_key_fixe_2026"
    entrypoint: >
      /bin/bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com
      "

  airflow-webserver:
    build:
      context: ./airflow
    container_name: lakehouse-airflow-webserver
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: "lakehouse_dev_secret_key_fixe_2026"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ICEBERG_CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8080:8080"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../spark:/opt/project/spark
      - ../data:/opt/project/data
      - ../docs:/opt/project/docs
      - ../dbt:/opt/project/dbt
    command: webserver

  airflow-scheduler:
    build:
      context: ./airflow
    container_name: lakehouse-airflow-scheduler
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: "lakehouse_dev_secret_key_fixe_2026"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ICEBERG_CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../spark:/opt/project/spark
      - ../data:/opt/project/data
      - ../docs:/opt/project/docs
      - ../dbt:/opt/project/dbt
    command: scheduler

volumes:
  minio_data:
  postgres_data:
  kafka_data: